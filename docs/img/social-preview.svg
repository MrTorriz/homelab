<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#2f81f7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.5"/>

  <!-- title -->
  <text x="60" y="200" font-size="96" font-weight="700" fill="#e6edf3" letter-spacing="-2">Homelab</text>

  <!-- tagline -->
  <text x="60" y="250" font-size="26" fill="#8b949e">
    Sanitized reference of a real homelab · 44 containers · 2026-08
  </text>

  <!-- accent line -->
  <rect x="60" y="285" width="180" height="4" fill="url(#accent)" rx="2"/>

  <!-- metrics grid — 4 stat cards, each centered in a 290 px column,
       column centers at x = 205, 495, 785, 1075 (60 px margin both sides) -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">
    <g transform="translate(205, 360)">
      <text font-size="56" font-weight="700" fill="#3fb950">44</text>
      <text y="36" font-size="18" fill="#8b949e">containers</text>
      <text y="58" font-size="18" fill="#8b949e">one VM</text>
    </g>

    <g transform="translate(495, 360)">
      <text font-size="56" font-weight="700" fill="#2f81f7">tunnel</text>
      <text y="36" font-size="18" fill="#8b949e">only</text>
      <text y="58" font-size="18" fill="#8b949e">ingress</text>
    </g>

    <g transform="translate(785, 360)">
      <text font-size="56" font-weight="700" fill="#e3b341">6 VMs</text>
      <text y="36" font-size="18" fill="#8b949e">Proxmox VE</text>
      <text y="58" font-size="18" fill="#8b949e">8.4</text>
    </g>

    <g transform="translate(1075, 360)">
      <text font-size="56" font-weight="700" fill="#f85149">19</text>
      <text y="36" font-size="18" fill="#8b949e">ntfy</text>
      <text y="58" font-size="18" fill="#8b949e">callers</text>
    </g>
  </g>

  <!-- bottom strip: tags -->
  <g transform="translate(60, 560)" font-size="18" fill="#8b949e">
    <text><tspan fill="#3fb950">#</tspan>docker  <tspan fill="#3fb950">#</tspan>security  <tspan fill="#3fb950">#</tspan>selfhosted  <tspan fill="#3fb950">#</tspan>defense-in-depth  <tspan fill="#3fb950">#</tspan>proxmox</text>
  </g>

</svg>
