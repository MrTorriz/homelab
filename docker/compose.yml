# ────────────────────────────────────────────────────────────
# Homelab — Docker Compose stack
#
# A self-hosted stack covering media, photos, files & sync,
# DNS, security, observability and reverse proxy.
# 43 services here + 1 personal service (private image)
# = 44 containers on the live host (2026-08-28).
# Every container runs with `no-new-privileges` and binds only
# to the LAN interface (or 127.0.0.1).
#
# Setup:  cp .env.example .env  →  edit  →  docker compose up -d
# ────────────────────────────────────────────────────────────

services:

  # ── Reverse proxy ────────────────────────────────────────
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    ports:
      - "${LAN_IP}:80:80"
      - "${LAN_IP}:81:81"
      - "${LAN_IP}:443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${APPDATA_DIR}/npm/data:/data
      - ${APPDATA_DIR}/npm/letsencrypt:/etc/letsencrypt
    networks: [default]

  # ── Dashboards ───────────────────────────────────────────
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: always
    security_opt: [no-new-privileges:true]
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=${LAN_IP}:3000,${LAN_IP},localhost,homepage.${DOMAIN}
      - DOCKER_HOST=tcp://docker-proxy:2375
    volumes:
      - ${APPDATA_DIR}/homepage:/app/config
      - ${MEDIA_DIR}:/mnt/media:ro
      - ${STORAGE_DIR}:/mnt/storage:ro
    ports:
      - "${LAN_IP}:3000:3000"
    depends_on: [docker-proxy]
    networks: [default, socket-ro]

  glance:
    image: glanceapp/glance:latest
    container_name: glance
    restart: always
    security_opt: [no-new-privileges:true]
    ports:
      - "${LAN_IP}:8092:8080"
    volumes:
      - ${APPDATA_DIR}/glance/glance.yml:/app/config/glance.yml
      - ${APPDATA_DIR}/glance/custom.css:/app/assets/custom.css:ro
    networks: [default]

  # Second Glance instance with a different theme, kept as an alternative
  # start page. (Theme-switching via Homepage iframes was retired 2026-06-21.)
  glance-amber:
    image: glanceapp/glance:latest
    container_name: glance-amber
    restart: always
    security_opt: [no-new-privileges:true]
    ports:
      - "${LAN_IP}:8095:8080"
    volumes:
      - ${APPDATA_DIR}/glance/glance.amber.yml:/app/config/glance.yml:ro
      - ${APPDATA_DIR}/glance/pages.yml:/app/config/pages.yml:ro
      - ${APPDATA_DIR}/glance/custom.css:/app/assets/custom.css:ro
    networks: [default]

  # ── Docker management ────────────────────────────────────
  # Two socket proxies with different blast radius (since 2026-08-23):
  #   docker-proxy    read-only API (POST=0) on `socket-ro`, consumed by
  #                   homepage, dozzle, diun and glances (via 127.0.0.1:2375)
  #   docker-proxy-rw write API (POST=1) on the internal `socket-rw` net,
  #                   reachable only by the containers that must mutate
  #                   state (watchtower, portainer). No published ports.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-proxy
    restart: always
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:2375:2375"
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - INFO=1
      - NETWORKS=1
      - SERVICES=1
      - TASKS=1
      - VOLUMES=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket-ro]

  docker-proxy-rw:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-proxy-rw
    restart: always
    security_opt: [no-new-privileges:true]
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - INFO=1
      - NETWORKS=1
      - SERVICES=1
      - TASKS=1
      - VOLUMES=1
      - POST=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket-rw]

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    security_opt: [no-new-privileges:true]
    environment:
      - DOCKER_HOST=tcp://docker-proxy-rw:2375
    volumes:
      - ${APPDATA_DIR}/portainer:/data
    ports:
      - "${LAN_IP}:9000:9000"
    depends_on: [docker-proxy-rw]
    networks: [default, socket-rw]

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      - DOCKER_HOST=tcp://docker-proxy:2375
    ports:
      - "${LAN_IP}:8888:8080"
    depends_on: [docker-proxy]
    networks: [default, socket-ro]

  # containrrr/watchtower is archived; the nicholas-fedor fork is maintained.
  # Containers that must not be auto-updated carry the label
  # `com.centurylinklabs.watchtower.enable=false` (reverse proxy, databases,
  # DNS, tunnel, SMART monitor, Immich).
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      - DOCKER_HOST=tcp://docker-proxy-rw:2375
      - DOCKER_API_VERSION=1.45
      - WATCHTOWER_CLEANUP=true
      # The host runs cron in UTC while the other containers use ${TZ}.
      # This container is pinned to UTC so the schedule below can be read
      # side by side with `crontab -l` without converting.
      # 02:00 UTC deliberately sits before the backup chain (appdata backup
      # 04:00 UTC, offsite rclone 04:30 UTC, running 4-7 h). Never schedule
      # restarts inside 04-11 UTC: the offsite job syncs appdata live and
      # containers restarting mid-sync produce an inconsistent copy.
      - WATCHTOWER_SCHEDULE=0 0 2 * * *
      - TZ=UTC
    depends_on: [docker-proxy-rw]
    networks: [default, socket-rw]

  # Notify-only image radar: checks registries weekly (Mon 09:00) and posts
  # to ntfy. It never pulls or restarts anything, so it only needs the
  # read-only proxy.
  diun:
    image: crazymax/diun:latest
    container_name: diun
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      - TZ=${TZ}
      - DIUN_WATCH_SCHEDULE=0 0 9 * * 1
      - DIUN_WATCH_JITTER=30s
      - DIUN_WATCH_FIRSTCHECKNOTIF=false
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_ENDPOINT=tcp://docker-proxy:2375
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true
      - DIUN_NOTIF_NTFY_ENDPOINT=http://ntfy
      - DIUN_NOTIF_NTFY_TOPIC=${NTFY_TOPIC}
      - DIUN_NOTIF_NTFY_TOKEN=${NTFY_TOKEN}
      - DIUN_NOTIF_NTFY_PRIORITY=3
    volumes:
      - ${APPDATA_DIR}/diun:/data
    depends_on: [docker-proxy, ntfy]
    networks: [default, socket-ro]

  # ── Media stack ──────────────────────────────────────────
  # Jellyfin replaced Plex on 2026-06-20. NVENC via the NVIDIA runtime.
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    runtime: nvidia
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8096/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    volumes:
      - ${APPDATA_DIR}/jellyfin:/config
      - ${MEDIA_DIR}:/mnt/media:ro
      - ${STORAGE_DIR}/data:/data:ro
    ports:
      - "${LAN_IP}:8096:8096"
    networks: [default]

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/sonarr:/config
      - ${STORAGE_DIR}/data:/data
      - ${MEDIA_DIR}:/mnt/media
    ports:
      - "${LAN_IP}:8989:8989"
    networks: [default]

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/radarr:/config
      - ${STORAGE_DIR}/data:/data
      - ${MEDIA_DIR}:/mnt/media
    ports:
      - "${LAN_IP}:7878:7878"
    networks: [default]

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/lidarr:/config
      - ${STORAGE_DIR}/data:/data
      - ${MEDIA_DIR}/music:/music
    ports:
      - "${LAN_IP}:8686:8686"
    networks: [default]

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/bazarr:/config
      - ${STORAGE_DIR}/data:/data
      - ${MEDIA_DIR}:/mnt/media
    ports:
      - "${LAN_IP}:6767:6767"
    networks: [default]

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/prowlarr:/config
    ports:
      - "${LAN_IP}:9696:9696"
    networks: [default]

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    ports:
      - "${LAN_IP}:8191:8191"
    networks: [default]

  qbittorrent:
    # Bound to VPN interface on host — see security/vpn-killswitch.md
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: host
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ${APPDATA_DIR}/qbittorrent:/config
      - ${STORAGE_DIR}/data:/data

  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest
    container_name: tdarr
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=true
      - inContainer=true
      - ffmpegVersion=7
    volumes:
      - ${APPDATA_DIR}/tdarr/server:/app/server
      - ${APPDATA_DIR}/tdarr/configs:/app/configs
      - ${APPDATA_DIR}/tdarr/logs:/app/logs
      - ${STORAGE_DIR}/tdarr-cache:/temp
      - ${MEDIA_DIR}:/media
    ports:
      - "${LAN_IP}:8265:8265"
      - "${LAN_IP}:8266:8266"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks: [default]

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      - TZ=${TZ}
    ports:
      - "${LAN_IP}:5055:5055"
    volumes:
      - ${APPDATA_DIR}/seerr:/app/config
    networks: [default]

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/audiobookshelf/config:/config
      - ${APPDATA_DIR}/audiobookshelf/metadata:/metadata
      - ${MEDIA_DIR}/books:/books
    ports:
      - "${LAN_IP}:8000:80"
    networks: [default]

  # ── Photos (Immich, GPU-accelerated) ─────────────────────
  # Server uses NVENC for video transcodes; ML uses CUDA for CLIP
  # smart-search + buffalo_l face detection. Storage template
  # (year/month/filename) and tuned concurrency are configured
  # via the Immich admin API after first boot — see docker/README.md.
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    container_name: immich_server
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: always
    security_opt: [no-new-privileges:true]
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    env_file: [.env]
    volumes:
      - ${STORAGE_DIR}/immich-photos:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${LAN_IP}:2283:2283"
    depends_on: [immich-redis, immich-postgres]
    networks: [default]

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION}-cuda
    container_name: immich_machine_learning
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: always
    security_opt: [no-new-privileges:true]
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    env_file: [.env]
    volumes:
      - ${APPDATA_DIR}/immich/model-cache:/cache
    networks: [default]

  immich-redis:
    image: redis:6.2-alpine
    container_name: immich_redis
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: always
    security_opt: [no-new-privileges:true]
    networks: [default]

  immich-postgres:
    image: tensorchord/pgvecto-rs:pg14-v0.2.0
    container_name: immich_postgres
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: always
    security_opt: [no-new-privileges:true]
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_DB=${DB_DATABASE_NAME}
    volumes:
      - ${APPDATA_DIR}/immich/postgres:/var/lib/postgresql/data
    networks: [default]

  # ── Files & sync (Nextcloud) ─────────────────────────────
  # Three-container stack: app (apache), Postgres 16, Redis 7.
  # External storage at ${STORAGE_DIR}/Nextcloud is mounted read-write so users
  # can browse host-side directories (e.g. per-device backup folders) directly.
  nextcloud:
    image: nextcloud:30-apache
    container_name: nextcloud
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: always
    security_opt: [no-new-privileges:true]
    environment:
      - POSTGRES_HOST=nextcloud-db
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=${NEXTCLOUD_DB_PASS}
      - REDIS_HOST=nextcloud-redis
      - REDIS_HOST_PASSWORD=${NEXTCLOUD_REDIS_PASS}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASS}
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_DOMAIN} ${LAN_IP}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES}
      - OVERWRITEPROTOCOL=https
      - OVERWRITEHOST=${NEXTCLOUD_DOMAIN}
      - OVERWRITECLIURL=https://${NEXTCLOUD_DOMAIN}
      - PHP_MEMORY_LIMIT=1G
      - PHP_UPLOAD_LIMIT=10G
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/nextcloud/html:/var/www/html
      - ${STORAGE_DIR}/Nextcloud:/external/storage:rw
    ports:
      - "${LAN_IP}:8081:80"
    depends_on: [nextcloud-db, nextcloud-redis]
    networks: [default]

  nextcloud-db:
    image: postgres:16-alpine
    container_name: nextcloud-db
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: always
    security_opt: [no-new-privileges:true]
    environment:
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=${NEXTCLOUD_DB_PASS}
      - POSTGRES_DB=nextcloud
    volumes:
      - ${APPDATA_DIR}/nextcloud-db:/var/lib/postgresql/data
    networks: [default]

  nextcloud-redis:
    image: redis:7-alpine
    container_name: nextcloud-redis
    restart: always
    security_opt: [no-new-privileges:true]
    command: redis-server --requirepass ${NEXTCLOUD_REDIS_PASS}
    volumes:
      - ${APPDATA_DIR}/nextcloud-redis:/data
    networks: [default]

  # ── Network-wide DNS / ad-blocking ───────────────────────
  adguardhome:
    image: adguard/adguardhome
    container_name: adguardhome
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: unless-stopped
    network_mode: host
    security_opt: [no-new-privileges:true]
    volumes:
      - ${APPDATA_DIR}/adguard/work:/opt/adguardhome/work
      - ${APPDATA_DIR}/adguard/conf:/opt/adguardhome/conf

  # ── Security ─────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    command: tunnel --loglevel info run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks: [default]

  # ── Observability ────────────────────────────────────────
  glances:
    image: nicolargo/glances:latest-full
    container_name: glances
    restart: always
    pid: host
    network_mode: host
    security_opt: [no-new-privileges:true]
    cap_add: [SYS_PTRACE, NET_ADMIN]
    volumes:
      - /dev:/dev:ro
      - ${STORAGE_DIR}:/mnt/storage:ro
      - ${MEDIA_DIR}:/mnt/media
    environment:
      - GLANCES_OPT=-w --bind ${LAN_IP}
      - DOCKER_HOST=tcp://127.0.0.1:2375
    depends_on: [docker-proxy]

  scrutiny:
    # Reads SMART data — needs raw disk access (acceptable trade-off)
    image: ghcr.io/analogj/scrutiny:master-omnibus
    container_name: scrutiny
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_add: [SYS_RAWIO]
    ports:
      - "${LAN_IP}:8082:8080"
    volumes:
      - /run/udev:/run/udev:ro
      - ${APPDATA_DIR}/scrutiny/config:/opt/scrutiny/config
      - ${APPDATA_DIR}/scrutiny/influxdb:/opt/scrutiny/influxdb
    devices:
      - /dev/sda:/dev/sda
      - /dev/sdb:/dev/sdb
      - /dev/nvme0n1:/dev/nvme0n1
    networks: [default]

  speedtest:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest
    restart: always
    security_opt: [no-new-privileges:true]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - SPEEDTEST_SCHEDULE=0 3 * * *
      - APP_KEY=${SPEEDTEST_APP_KEY}
    volumes:
      - ${APPDATA_DIR}/speedtest/config:/config
    ports:
      - "${LAN_IP}:8765:80"
    networks: [default]

  # ── Notifications & RSS ──────────────────────────────────
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    command: serve
    environment:
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/ntfy/cache:/var/cache/ntfy
      - ${APPDATA_DIR}/ntfy/etc:/etc/ntfy
    ports:
      - "${LAN_IP}:8084:80"
    networks: [default]

  miniflux:
    image: miniflux/miniflux:latest
    container_name: miniflux
    restart: always
    security_opt: [no-new-privileges:true]
    environment:
      - DATABASE_URL=postgres://miniflux:${MINIFLUX_DB_PASS}@miniflux-db/miniflux?sslmode=disable
      - RUN_MIGRATIONS=1
      - CREATE_ADMIN=1
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=${MINIFLUX_ADMIN_PASS}
      - BASE_URL=https://miniflux.${DOMAIN}
      - TZ=${TZ}
    ports:
      - "${LAN_IP}:8070:8080"
    depends_on: [miniflux-db]
    networks: [default]

  miniflux-db:
    image: postgres:16-alpine
    container_name: miniflux-db
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: always
    security_opt: [no-new-privileges:true]
    environment:
      - POSTGRES_USER=miniflux
      - POSTGRES_PASSWORD=${MINIFLUX_DB_PASS}
      - POSTGRES_DB=miniflux
    volumes:
      - ${APPDATA_DIR}/miniflux-db:/var/lib/postgresql/data
    networks: [default]

  # ── Utilities ────────────────────────────────────────────
  it-tools:
    image: corentinth/it-tools:latest
    container_name: it-tools
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    ports:
      - "${LAN_IP}:8090:80"
    networks: [default]

  drawio:
    image: jgraph/drawio:latest
    container_name: drawio
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    ports:
      - "${LAN_IP}:8108:8080"
    networks: [default]

  # ── Observability (Prometheus + Grafana) ─────────────────
  # Scrapes node-exporter (host metrics), nvidia-gpu-exporter (GPU watts/temp)
  # and cadvisor (per-container metrics). Scaphandre (RAPL power) was dropped
  # 2026-07-04; host power is no longer collected.
  # Grafana provisioning files live in `${APPDATA_DIR}/grafana/provisioning/`
  # — see `../monitoring/` in the repo for example configs and the dashboard.
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    user: "65534:65534"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-90d}'
      - '--web.enable-lifecycle'
    volumes:
      - ${APPDATA_DIR}/prometheus/config:/etc/prometheus:ro
      - ${APPDATA_DIR}/prometheus/data:/prometheus
    ports:
      - "${LAN_IP}:9090:9090"
    networks: [default]

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    user: "472:472"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://${GRAFANA_DOMAIN:-grafana.example.com}
      - GF_INSTALL_PLUGINS=
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ${APPDATA_DIR}/grafana/data:/var/lib/grafana
      - ${APPDATA_DIR}/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${APPDATA_DIR}/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${LAN_IP}:3001:3000"
    depends_on: [prometheus]
    networks: [default]

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    pid: host
    networks: [default]

  nvidia-gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.3.2
    container_name: nvidia-gpu-exporter
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    networks: [default]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks: [default]

networks:
  default:
    name: homelab
    driver: bridge
  # Write-capable socket proxy lives here. `internal: true` means no route
  # to the outside and no port publishing — only members can talk to it.
  socket-rw:
    name: socket-rw
    internal: true
  # Read-only socket proxy. The proxy used to sit on the default network,
  # so any container could ask it for inspect data (including env vars) of
  # every other container. Now only homepage, dozzle and diun are members.
  # Not `internal`: glances runs with network_mode: host and reaches the
  # proxy through the 127.0.0.1:2375 port mapping, which does not work on an
  # internal network.
  socket-ro:
    name: socket-ro
