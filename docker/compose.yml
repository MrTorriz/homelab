# ────────────────────────────────────────────────────────────
# Homelab — Docker Compose stack
#
# A self-hosted stack covering media, photos, files & sync,
# DNS, security, observability and reverse proxy.
# 45 services here + 1 personal service (private image)
# = 46 containers on the live host (2026-10-31).
# Every container runs with `no-new-privileges` and binds only
# to the LAN interface (or 127.0.0.1). Services that can grow
# under load carry a `mem_limit` — a ceiling, not a reservation.
#
# Setup:  cp .env.example .env  →  edit  →  docker compose up -d
# ────────────────────────────────────────────────────────────

services:

  # ── Reverse proxy ────────────────────────────────────────
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "/bin/check-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    ports:
      - "${LAN_IP}:80:80"
      - "${LAN_IP}:81:81"
      - "${LAN_IP}:443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${APPDATA_DIR}/npm/data:/data
      - ${APPDATA_DIR}/npm/letsencrypt:/etc/letsencrypt
    networks: [default]

  # ── Dashboards ───────────────────────────────────────────
  # Widget credentials come from a separate env file next to the config
  # (HOMEPAGE_VAR_* placeholders in services.yaml), never from compose.
  # The proxied hostnames resolve to the bridge gateway so widgets reach
  # NPM on the LAN instead of hairpinning out through the tunnel.
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: always
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    env_file:
      - path: ${APPDATA_DIR}/homepage/.env
        required: false
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=${LAN_IP}:3000,${LAN_IP},localhost,127.0.0.1,homepage.${DOMAIN}
      - DOCKER_HOST=tcp://docker-proxy:2375
    extra_hosts:
      - "hp.${DOMAIN}:${DOCKER_GATEWAY}"
      - "qbittorrent.${DOMAIN}:${DOCKER_GATEWAY}"
      - "auth.${DOMAIN}:${DOCKER_GATEWAY}"
    volumes:
      - ${APPDATA_DIR}/homepage:/app/config
      - ${APPDATA_DIR}/homepage/custom.css:/app/public/custom.css:ro
      - ${APPDATA_DIR}/homepage/custom.js:/app/public/custom.js:ro
      - ${APPDATA_DIR}/homepage/backup:/app/public/backup:ro
      - ${APPDATA_DIR}/homepage/icons:/app/public/icons:ro
      - ${MEDIA_DIR}:/mnt/media:ro
      - ${STORAGE_DIR}:/mnt/storage:ro
    ports:
      - "${LAN_IP}:3000:3000"
    depends_on: [docker-proxy]
    networks: [default, socket-ro]

  glance:
    image: glanceapp/glance:latest
    container_name: glance
    restart: always
    security_opt: [no-new-privileges:true]
    environment:
      - MINIFLUX_API_TOKEN=${MINIFLUX_API_TOKEN}
      - LAN_IP=${LAN_IP}
    ports:
      - "${LAN_IP}:8092:8080"
    volumes:
      - ${APPDATA_DIR}/glance/glance.yml:/app/config/glance.yml:ro
      - ${APPDATA_DIR}/glance/pages.yml:/app/config/pages.yml:ro
      - ${APPDATA_DIR}/glance/custom.css:/app/assets/custom.css:ro
    networks: [default]

  # Second Glance instance with a different theme, kept as an alternative
  # start page.
  glance-amber:
    image: glanceapp/glance:latest
    container_name: glance-amber
    restart: always
    security_opt: [no-new-privileges:true]
    environment:
      - MINIFLUX_API_TOKEN=${MINIFLUX_API_TOKEN}
      - LAN_IP=${LAN_IP}
    ports:
      - "${LAN_IP}:8095:8080"
    volumes:
      - ${APPDATA_DIR}/glance/glance.amber.yml:/app/config/glance.yml:ro
      - ${APPDATA_DIR}/glance/pages.yml:/app/config/pages.yml:ro
      - ${APPDATA_DIR}/glance/custom.css:/app/assets/custom.css:ro
    networks: [default]

  # ── Docker management ────────────────────────────────────
  # Two socket proxies with different blast radius:
  #   docker-proxy    read-only API (POST=0) on `socket-ro`, consumed by
  #                   homepage, dozzle, watchtower, diun and glances
  #                   (glances via 127.0.0.1:2375)
  #   docker-proxy-rw write API (POST=1) on the internal `socket-rw` net,
  #                   reachable only by Portainer. No published ports.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-proxy
    restart: always
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:2375:2375"
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - INFO=1
      - NETWORKS=1
      - NODES=1
      - SERVICES=1
      - TASKS=1
      - VOLUMES=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket-ro]

  # Write-capable proxy: internal `socket-rw` network only. Never attach it
  # to the default network and never publish a port for it.
  docker-proxy-rw:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-proxy-rw
    restart: always
    security_opt: [no-new-privileges:true]
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - INFO=1
      - NETWORKS=1
      - NODES=1
      - SERVICES=1
      - TASKS=1
      - VOLUMES=1
      - POST=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket-rw]

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    security_opt: [no-new-privileges:true]
    environment:
      - DOCKER_HOST=tcp://docker-proxy-rw:2375
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${APPDATA_DIR}/portainer:/data
    ports:
      - "${LAN_IP}:9000:9000"
    depends_on: [docker-proxy-rw]
    networks: [default, socket-rw]

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      - DOCKER_HOST=tcp://docker-proxy:2375
    ports:
      - "${LAN_IP}:8888:8080"
    depends_on: [docker-proxy]
    networks: [default, socket-ro]

  # containrrr/watchtower is archived; the nicholas-fedor fork is maintained.
  # Monitor-only: it checks registries nightly and reports, but never pulls
  # new images or restarts anything, so the read-only proxy is enough.
  # Image updates are applied by hand after reading the release notes.
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      - DOCKER_HOST=tcp://docker-proxy:2375
      - DOCKER_API_VERSION=1.45
      - WATCHTOWER_MONITOR_ONLY=true
      # The host runs cron in UTC while the other containers use ${TZ}.
      # This container is pinned to UTC so the schedule below can be read
      # side by side with `crontab -l` without converting.
      # 02:00 UTC sits before the backup chain (appdata backup 04:00 UTC,
      # offsite rclone 04:30 UTC, running 4-7 h).
      - WATCHTOWER_SCHEDULE=0 0 2 * * *
      - TZ=UTC
    depends_on: [docker-proxy]
    networks: [default, socket-ro]

  # Image-update radar: checks registries every Sunday 07:00 UTC. Results go
  # into the weekly summary report instead of a separate push. It never
  # pulls or restarts anything, so it only needs the read-only proxy.
  diun:
    image: crazymax/diun:latest
    container_name: diun
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      - TZ=UTC
      - DIUN_WATCH_SCHEDULE=0 0 7 * * 0
      - DIUN_WATCH_JITTER=30s
      - DIUN_WATCH_FIRSTCHECKNOTIF=false
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_ENDPOINT=tcp://docker-proxy:2375
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true
    volumes:
      - ${APPDATA_DIR}/diun:/data
    depends_on: [docker-proxy]
    networks: [default, socket-ro]

  # ── Media stack ──────────────────────────────────────────
  # NVENC via the NVIDIA container runtime.
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    runtime: nvidia
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8096/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - JELLYFIN_PublishedServerUrl=http://${LAN_IP}:8096
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    volumes:
      - ${APPDATA_DIR}/jellyfin:/config
      - ${MEDIA_DIR}:/mnt/media:ro
      - ${STORAGE_DIR}/data:/data:ro
      - ${STORAGE_DIR}/series:/mnt/storage/series:ro
    ports:
      - "${LAN_IP}:8096:8096"
      - "${LAN_IP}:7359:7359/udp"
    networks: [default]

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/sonarr:/config
      - ${STORAGE_DIR}/data:/data
      - ${STORAGE_DIR}:/mnt/storage
      - ${MEDIA_DIR}:/mnt/media
    ports:
      - "${LAN_IP}:8989:8989"
    networks: [default]

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/radarr:/config
      - ${STORAGE_DIR}/data:/data
      - ${MEDIA_DIR}:/mnt/media
    ports:
      - "${LAN_IP}:7878:7878"
    networks: [default]

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/lidarr:/config
      - ${STORAGE_DIR}/data:/data
      - ${MEDIA_DIR}/music:/music
    ports:
      - "${LAN_IP}:8686:8686"
    networks: [default]

  # Was OOM-killed at a 512 MiB ceiling.
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: "2.0"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/bazarr:/config
      - ${STORAGE_DIR}/data:/data
      - ${STORAGE_DIR}:/mnt/storage
      - ${MEDIA_DIR}:/mnt/media
    ports:
      - "${LAN_IP}:6767:6767"
    networks: [default]

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/prowlarr:/config
    ports:
      - "${LAN_IP}:9696:9696"
    networks: [default]

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TZ}
    ports:
      - "${LAN_IP}:8191:8191"
    networks: [default]

  # Host networking, killswitch-bound to the VPN interface — see
  # security/vpn-killswitch.md. The Web UI binds the LAN address, not
  # loopback, so the healthcheck has to use ${LAN_IP}.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: host
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://${LAN_IP}:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ${APPDATA_DIR}/qbittorrent:/config
      - ${STORAGE_DIR}/data:/data
      - ${MEDIA_DIR}:/mnt/media

  # ffmpeg transcodes are one of the two big memory consumers (with
  # Immich ML), hence the ceiling.
  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest
    container_name: tdarr
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK_SET=002
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=true
      - inContainer=true
      - ffmpegVersion=7
      - nodeName=docker-host
    volumes:
      - ${APPDATA_DIR}/tdarr/server:/app/server
      - ${APPDATA_DIR}/tdarr/configs:/app/configs
      - ${APPDATA_DIR}/tdarr/logs:/app/logs
      - ${STORAGE_DIR}/tdarr-cache:/temp
      - ${MEDIA_DIR}/movies:/media/movies
      - ${MEDIA_DIR}/series:/media/series
      - ${STORAGE_DIR}/series:/media/storage-series
    ports:
      - "${LAN_IP}:8265:8265"
      - "${LAN_IP}:8266:8266"
    networks: [default]

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    environment:
      - TZ=${TZ}
    ports:
      - "${LAN_IP}:5055:5055"
    volumes:
      - ${APPDATA_DIR}/seerr:/app/config
    networks: [default]

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/audiobookshelf/config:/config
      - ${APPDATA_DIR}/audiobookshelf/metadata:/metadata
      - ${MEDIA_DIR}/books:/books
    ports:
      - "${LAN_IP}:8000:80"
    networks: [default]

  # ── Photos (Immich, GPU-accelerated) ─────────────────────
  # Server uses NVENC for video transcodes; ML uses CUDA for CLIP
  # smart-search + buffalo_l face detection. Storage template
  # (year/month/filename) and tuned concurrency are configured
  # via the Immich admin API after first boot — see docker/README.md.
  # All four containers are updated by hand, together, to the version
  # pinned in IMMICH_VERSION.
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    container_name: immich_server
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: always
    security_opt: [no-new-privileges:true]
    # Ceilings, not reservations. Before they existed, an Immich ML burst
    # plus an ffmpeg transcode starved the host and pushed it into swap.
    mem_limit: 2g
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    env_file: [.env]
    volumes:
      - ${STORAGE_DIR}/immich-photos:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${LAN_IP}:2283:2283"
    depends_on: [immich-redis, immich-postgres]
    networks: [default]

  # The largest single memory consumer: CUDA models are loaded into host
  # RAM before they move to the GPU.
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION}-cuda
    container_name: immich_machine_learning
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: always
    security_opt: [no-new-privileges:true]
    mem_limit: 3g
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    env_file: [.env]
    volumes:
      - ${APPDATA_DIR}/immich/model-cache:/cache
    networks: [default]

  # Valkey, as in upstream Immich's own compose. No volume: this is the
  # BullMQ job queue, so recreating it only drops queued jobs, never photos.
  immich-redis:
    image: valkey/valkey:9
    container_name: immich_redis
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: always
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [default]

  # Pinned by digest, like upstream Immich's compose.
  immich-postgres:
    # yamllint disable-line rule:line-length
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich_postgres
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: always
    security_opt: [no-new-privileges:true]
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_DB=${DB_DATABASE_NAME}
    volumes:
      - ${APPDATA_DIR}/immich/postgres:/var/lib/postgresql/data
    networks: [default]

  # ── Files & sync (Nextcloud) ─────────────────────────────
  # Three-container stack: app (apache), Postgres 16, Redis 7.
  # External storage at ${STORAGE_DIR}/Nextcloud is mounted read-write so users
  # can browse host-side directories (e.g. per-device backup folders) directly.
  # App and database are updated together by hand: a new image usually needs
  # `occ upgrade` and a check afterwards.
  nextcloud:
    image: nextcloud:34-apache
    container_name: nextcloud
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: always
    security_opt: [no-new-privileges:true]
    # PHP_MEMORY_LIMIT applies per PHP process and Apache runs several
    # workers, so the container ceiling has to sit well above 1G.
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1/status.php || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    environment:
      - POSTGRES_HOST=nextcloud-db
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=${NEXTCLOUD_DB_PASS}
      - REDIS_HOST=nextcloud-redis
      - REDIS_HOST_PASSWORD=${NEXTCLOUD_REDIS_PASS}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASS}
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_DOMAIN} ${LAN_IP}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES}
      - OVERWRITEPROTOCOL=https
      - OVERWRITEHOST=${NEXTCLOUD_DOMAIN}
      - OVERWRITECLIURL=https://${NEXTCLOUD_DOMAIN}
      - PHP_MEMORY_LIMIT=1G
      - PHP_UPLOAD_LIMIT=10G
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/nextcloud/html:/var/www/html
      - ${STORAGE_DIR}/Nextcloud:/external/storage:rw
    ports:
      - "${LAN_IP}:8081:80"
    depends_on: [nextcloud-db, nextcloud-redis]
    networks: [default]

  nextcloud-db:
    image: postgres:16-alpine
    container_name: nextcloud-db
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: always
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=${NEXTCLOUD_DB_PASS}
      - POSTGRES_DB=nextcloud
    volumes:
      - ${APPDATA_DIR}/nextcloud-db:/var/lib/postgresql/data
    networks: [default]

  nextcloud-redis:
    image: redis:7-alpine
    container_name: nextcloud-redis
    restart: always
    security_opt: [no-new-privileges:true]
    command: redis-server --requirepass ${NEXTCLOUD_REDIS_PASS}
    environment:
      - REDISCLI_AUTH=${NEXTCLOUD_REDIS_PASS}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ${APPDATA_DIR}/nextcloud-redis:/data
    networks: [default]

  # ── Network-wide DNS / ad-blocking ───────────────────────
  # Host networking: the admin UI listens on the LAN address, so the
  # healthcheck uses ${LAN_IP} rather than loopback.
  adguardhome:
    image: adguard/adguardhome
    container_name: adguardhome
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: unless-stopped
    network_mode: host
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://${LAN_IP}:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ${APPDATA_DIR}/adguard/work:/opt/adguardhome/work
      - ${APPDATA_DIR}/adguard/conf:/opt/adguardhome/conf

  # ── Tunnel ingress ───────────────────────────────────────
  # cloudflared has no network stack of its own: it joins the namespace of
  # cloudflare-egress, a WARP client whose encrypted transport leaves through
  # the host's Mullvad tunnel. See cloudflare-egress/README.md.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    command: tunnel --loglevel info --edge-ip-version 4 --protocol http2 --metrics 0.0.0.0:20241 run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    network_mode: service:cloudflare-egress
    depends_on:
      cloudflare-egress:
        condition: service_healthy

  # The only container with NET_ADMIN and /dev/net/tun. Nothing published.
  cloudflare-egress:
    image: cloudflare-egress:local
    build: ./cloudflare-egress
    container_name: cloudflare-egress
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv6.conf.all.disable_ipv6: '1'
      net.ipv6.conf.default.disable_ipv6: '1'
    volumes:
      # WARP registration and private keys: keep this directory 0700 and
      # out of version control.
      - ${APPDATA_DIR}/cloudflare-egress:/var/lib/cloudflare-warp
    healthcheck:
      test: ["CMD", "/usr/local/sbin/healthcheck.sh"]
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      default:
        aliases: [cloudflared]

  # ── Observability ────────────────────────────────────────
  # Runs as root with host PID and host networking, so it gets no extra
  # capabilities: SYS_PTRACE would allow reading every process's memory and
  # NET_ADMIN would allow rewriting host routing (i.e. bypassing the VPN
  # killswitch). CPU, memory, disk and network all come from /proc.
  glances:
    image: nicolargo/glances:latest-full
    container_name: glances
    restart: always
    pid: host
    network_mode: host
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    volumes:
      - /dev:/dev:ro
      - ${STORAGE_DIR}:/mnt/storage:ro
      - ${MEDIA_DIR}:/mnt/media:ro
    environment:
      - GLANCES_OPT=-w --bind ${LAN_IP}
      - DOCKER_HOST=tcp://127.0.0.1:2375
    depends_on: [docker-proxy]

  # Reads SMART data — needs raw disk access (acceptable trade-off).
  # Disks are addressed by /dev/disk/by-id so a reshuffled sdX name can
  # never point SMART reads at the wrong drive. master-omnibus is a branch
  # tag, not a release, so it is updated by hand after review.
  scrutiny:
    image: ghcr.io/analogj/scrutiny:master-omnibus
    container_name: scrutiny
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_add: [SYS_RAWIO]
    ports:
      - "${LAN_IP}:8082:8080"
    volumes:
      - /run/udev:/run/udev:ro
      - ${APPDATA_DIR}/scrutiny/config:/opt/scrutiny/config
      - ${APPDATA_DIR}/scrutiny/influxdb:/opt/scrutiny/influxdb
    devices:
      - ${SMART_DISK_1}:/dev/sdb
      - ${SMART_DISK_2}:/dev/sdc
    networks: [default]

  # HTTP checks for the web services. No published port:
  # reached through the reverse proxy only.
  uptime-kuma:
    image: louislam/uptime-kuma:2@sha256:20abea8c48a163cf0a7a5d5936ab418e4b742d908704e1f58f6c06e56a9c6b67
    container_name: uptime-kuma
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    volumes:
      - ${APPDATA_DIR}/uptime-kuma:/app/data
    networks: [default]

  # Host networking so measurements see the host's real egress (the VPN).
  # The bundled nginx site config is edited to listen on ${LAN_IP}:8765 only.
  speedtest:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest
    restart: always
    security_opt: [no-new-privileges:true]
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - SPEEDTEST_SCHEDULE=0 3 * * *
      # Comma-separated Speedtest server IDs; empty lets the tool choose.
      - SPEEDTEST_SERVERS=${SPEEDTEST_SERVERS:-}
      - APP_KEY=${SPEEDTEST_APP_KEY}
    volumes:
      - ${APPDATA_DIR}/speedtest/config:/config

  # ── Notifications & RSS ──────────────────────────────────
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    command: serve
    environment:
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/ntfy/cache:/var/cache/ntfy
      - ${APPDATA_DIR}/ntfy/etc:/etc/ntfy
    ports:
      - "${LAN_IP}:8084:80"
    networks: [default]

  miniflux:
    image: miniflux/miniflux:latest
    container_name: miniflux
    restart: always
    security_opt: [no-new-privileges:true]
    environment:
      - DATABASE_URL=postgres://miniflux:${MINIFLUX_DB_PASS}@miniflux-db/miniflux?sslmode=disable
      - RUN_MIGRATIONS=1
      - CREATE_ADMIN=1
      - ADMIN_USERNAME=${MINIFLUX_ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${MINIFLUX_ADMIN_PASS}
      - BASE_URL=https://miniflux.${DOMAIN}
      - TZ=${TZ}
      # Some feeds rate-limit the shared VPN exit. Without this, Miniflux
      # pauses a feed after three failed fetches and the start page goes empty.
      - POLLING_PARSING_ERROR_LIMIT=0
    ports:
      - "${LAN_IP}:8070:8080"
    depends_on: [miniflux-db]
    networks: [default]

  miniflux-db:
    image: postgres:16-alpine
    container_name: miniflux-db
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: always
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniflux -d miniflux || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - POSTGRES_USER=miniflux
      - POSTGRES_PASSWORD=${MINIFLUX_DB_PASS}
      - POSTGRES_DB=miniflux
    volumes:
      - ${APPDATA_DIR}/miniflux-db:/var/lib/postgresql/data
    networks: [default]

  # ── Utilities ────────────────────────────────────────────
  it-tools:
    image: corentinth/it-tools:latest
    container_name: it-tools
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    ports:
      - "${LAN_IP}:8090:80"
    networks: [default]

  drawio:
    image: jgraph/drawio:latest
    container_name: drawio
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    volumes:
      - ${APPDATA_DIR}/drawio:/usr/local/tomcat/webapps/draw/diagrams:ro
    ports:
      - "${LAN_IP}:8108:8080"
    networks: [default]

  # ── Observability (Prometheus + Grafana) ─────────────────
  # Scrapes node-exporter (host metrics), nvidia-gpu-exporter (GPU watts/temp)
  # and cadvisor (per-container metrics). Host CPU/RAM power (Scaphandre) is
  # not collected.
  # Grafana provisioning files live in `${APPDATA_DIR}/grafana/provisioning/`
  # — see `../monitoring/` in the repo for example configs and the dashboard.
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    user: "65534:65534"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-90d}'
      - '--web.enable-lifecycle'
    volumes:
      - ${APPDATA_DIR}/prometheus/config:/etc/prometheus:ro
      - ${APPDATA_DIR}/prometheus/data:/prometheus
    ports:
      - "${LAN_IP}:9090:9090"
    networks: [default]

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    user: "472:472"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://${GRAFANA_DOMAIN:-grafana.example.com}
      - GF_INSTALL_PLUGINS=
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ${APPDATA_DIR}/grafana/data:/var/lib/grafana
      - ${APPDATA_DIR}/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${APPDATA_DIR}/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${LAN_IP}:3001:3000"
    depends_on: [prometheus]
    networks: [default]

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    pid: host
    networks: [default]

  # Semver trap: 1.13.1 is newer than 1.3.2.
  nvidia-gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.13.1
    container_name: nvidia-gpu-exporter
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    networks: [default]

  # gcr.io/cadvisor stopped receiving builds after v0.53.0, so its `latest`
  # tag froze; upstream now publishes on ghcr.io. Docker containers only.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: cadvisor
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    command: ["--docker_only=true"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks: [default]

networks:
  default:
    name: homelab
    driver: bridge
  # Write-capable socket proxy lives here. `internal: true` means no route
  # to the outside and no port publishing — only members can talk to it.
  socket-rw:
    name: socket-rw
    internal: true
  # Read-only socket proxy. The proxy used to sit on the default network,
  # so any container could ask it for inspect data (including env vars) of
  # every other container. Now only homepage, dozzle, watchtower and diun
  # are members.
  # Not `internal`: glances runs with network_mode: host and reaches the
  # proxy through the 127.0.0.1:2375 port mapping, which does not work on an
  # internal network.
  socket-ro:
    name: socket-ro
