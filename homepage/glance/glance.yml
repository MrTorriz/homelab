# ────────────────────────────────────────────────────────────
# Glance — base config (default theme)
#
# Glance runs as two sibling instances: this default one and an
# amber-themed variant (`glance.amber.yml`). The amber variant only
# differs in the `theme:` block. Both variants reuse the page list from
# `pages.yml` through Glance's `$include:` directive.
# ────────────────────────────────────────────────────────────

server:
  port: 8080
  assets-path: /app/assets

theme:
  background-color: 0 0 2
  contrast-multiplier: 1.15
  text-saturation-multiplier: 0.5
  primary-color: 0 0 95
  positive-color: 142 71 45
  negative-color: 348 100 60
  custom-css-file: /assets/custom.css

pages:
  $include: pages.yml
