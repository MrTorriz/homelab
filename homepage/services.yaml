# Homepage services config — group-by-row layout
#
# Mirrors the live dashboard as of 2026-08-28, with the domain replaced by
# `example.com` and personal tiles removed.
# `container:` entries are auto-discovered via the read-only docker-socket-proxy.
# `{{HOMEPAGE_VAR_*}}` placeholders are pulled from Homepage's own .env.

# Row 1 — four balanced groups (Network / System / Media / Links)

- Network:
    - AdGuard Home:
        icon: adguard-home.png
        href: https://adguard.example.com
        container: adguardhome
        description: DNS filtering & ad blocking
        widget:
          type: adguard
          url: http://${LAN_IP}:3000
          username: '{{HOMEPAGE_VAR_ADGUARD_USERNAME}}'
          password: '{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}'
          fields: ["queries", "blocked", "filtered"]
    - Nginx Proxy Manager:
        icon: nginx-proxy-manager.png
        href: https://npm.example.com
        container: npm
        description: Reverse proxy & SSL certs
        widget:
          type: npm
          url: http://npm:81
          username: '{{HOMEPAGE_VAR_NPM_USERNAME}}'
          password: '{{HOMEPAGE_VAR_NPM_PASSWORD}}'
    - Cloudflared:
        icon: cloudflare.png
        href: https://one.dash.cloudflare.com
        container: cloudflared
        description: Tunnel & Zero Trust access
        widget:
          type: cloudflared
          accountid: '{{HOMEPAGE_VAR_CLOUDFLARED_ACCOUNT}}'
          tunnelid: '{{HOMEPAGE_VAR_CLOUDFLARED_TUNNEL}}'
          key: '{{HOMEPAGE_VAR_CLOUDFLARED_KEY}}'
          fields: ["status"]
    - Speedtest Tracker:
        icon: speedtest-tracker.png
        href: https://speedtest.example.com
        container: speedtest
        description: Internet speed monitoring
        widget:
          type: speedtest
          url: http://${LAN_IP}:8765
          fields: ["download", "upload"]

- System:
    - Portainer:
        icon: portainer.png
        href: https://portainer.example.com
        container: portainer
        description: Container management
        widget:
          type: portainer
          url: http://portainer:9000
          env: 3
          key: '{{HOMEPAGE_VAR_PORTAINER_KEY}}'
    - Nextcloud:
        icon: nextcloud.png
        href: https://cloud.example.com
        container: nextcloud
        description: Laptop, iPhone & server sync
        widget:
          # Used/free on the storage volume, read from Prometheus (node-exporter)
          # rather than the Glances API: Glances 4.5.x dropped the v3 API and its
          # fs plugin returns an empty list inside a container.
          # label_replace is required: Prometheus `or` compares label sets
          # without __name__, so without the `k` label the two series collide
          # and one is silently dropped. Order: result[0] = used, result[1] = free.
          type: customapi
          url: "http://prometheus:9090/api/v1/query?query=\
            label_replace%28node_filesystem_size_bytes%7Bmountpoint%3D%22%2Fmnt%2Fstorage%22%7D%20-%20\
            node_filesystem_avail_bytes%7Bmountpoint%3D%22%2Fmnt%2Fstorage%22%7D%2C%20%22k%22%2C%20%22a_used%22%2C%20%22%22%2C%20%22%22%29\
            %20or%20label_replace%28node_filesystem_avail_bytes%7Bmountpoint%3D%22%2Fmnt%2Fstorage%22%7D%2C%20%22k%22%2C%20%22b_free%22%2C%20%22%22%2C%20%22%22%29"
          refreshInterval: 60000
          mappings:
            - field:
                data:
                  result:
                    "0":
                      value: "1"
              label: Used
              format: bytes
            - field:
                data:
                  result:
                    "1":
                      value: "1"
              label: Free
              format: bytes
    - Grafana:
        icon: grafana.png
        href: https://grafana.example.com/d/homelab-overview
        container: grafana
        description: Server stats & energy
        widget:
          # GPU power + temperature from nvidia-gpu-exporter. Host power used
          # to come from Scaphandre (removed 2026-07-04).
          type: customapi
          url: "http://prometheus:9090/api/v1/query?query=\
            %7B__name__%3D~%22nvidia_smi_power_draw_watts%7Cnvidia_smi_temperature_gpu%22%7D"
          refreshInterval: 30000
          mappings:
            - field:
                data:
                  result:
                    "0":
                      value: "1"
              label: GPU
              suffix: " W"
              format: float
            - field:
                data:
                  result:
                    "1":
                      value: "1"
              label: Temp
              suffix: "°C"
              format: float
    - Scrutiny:
        icon: scrutiny.png
        href: https://scrutiny.example.com
        container: scrutiny
        description: Disk health monitoring
        widget:
          # Scrutiny keys devices by NVMe serial / SATA WWN. Replace the
          # placeholders with the identifiers shown at /api/summary on your box.
          type: customapi
          url: http://scrutiny:8080/api/summary
          refreshInterval: 300000
          mappings:
            - field:
                data:
                  summary:
                    "<nvme-serial>":
                      smart: temp
              label: NVMe
              suffix: "°C"
            - field:
                data:
                  summary:
                    "<hdd-wwn-1>":
                      smart: temp
              label: HDD1
              suffix: "°C"
            - field:
                data:
                  summary:
                    "<hdd-wwn-2>":
                      smart: temp
              label: HDD2
              suffix: "°C"
    - Dozzle:
        icon: dozzle.png
        href: https://dozzle.example.com
        container: dozzle
        description: Container logs
        widget:
          # Running-container count from cadvisor via Prometheus.
          type: customapi
          url: http://prometheus:9090/api/v1/query?query=count(container_last_seen%7Bname!%3D%22%22%7D)
          refreshInterval: 60000
          mappings:
            - field:
                data:
                  result:
                    "0":
                      value: "1"
              label: Containers
              format: number

- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: https://jellyfin.example.com
        container: jellyfin
        description: Media streaming server
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: '{{HOMEPAGE_VAR_JELLYFIN_KEY}}'
          enableBlocks: true
          enableNowPlaying: false
          fields: ["movies", "series", "songs"]
    - qBittorrent:
        icon: qbittorrent.png
        href: https://qbittorrent.example.com
        container: qbittorrent
        description: Torrent client (VPN-bound)
        widget:
          type: qbittorrent
          url: http://${LAN_IP}:8080
          username: '{{HOMEPAGE_VAR_QBIT_USER}}'
          password: '{{HOMEPAGE_VAR_QBIT_PASS}}'
          fields: ["leech", "seed", "download"]
    - Audiobookshelf:
        icon: audiobookshelf.png
        href: https://audiobookshelf.example.com
        container: audiobookshelf
        description: Audiobook library
        widget:
          type: audiobookshelf
          url: http://audiobookshelf:80
          key: '{{HOMEPAGE_VAR_AUDIOBOOKSHELF_KEY}}'
          fields: ["books", "podcasts"]
    - Immich:
        icon: immich.png
        href: https://immich.example.com
        container: immich_server
        description: Photo & video backup
        widget:
          type: immich
          url: http://immich_server:2283
          key: '{{HOMEPAGE_VAR_IMMICH_KEY}}'
          version: 2
          fields: ["users", "photos", "videos"]

- Links:
    - Ntfy:
        icon: ntfy.png
        href: https://ntfy.example.com
        container: ntfy
        description: Push notifications
    - IT-Tools:
        icon: it-tools.png
        href: https://tools.example.com
        container: it-tools
        description: Developer utilities
    - Draw.io:
        icon: draw-io.png
        href: https://drawio.example.com
        container: drawio
        description: Proxmox topology
    - Proxmox VE:
        icon: proxmox.png
        href: https://proxmox.example.com
        description: Hypervisor web UI
        siteMonitor: https://proxmox.example.com
    - GitHub:
        icon: github.png
        href: https://github.com
        description: Public repos
        siteMonitor: https://github.com
    - Router:
        icon: mdi-router-wireless
        href: https://router.example.com
        description: ISP gateway
        siteMonitor: https://router.example.com
    - Glance:
        icon: mdi-newspaper-variant-multiple
        href: https://glance.example.com
        container: glance
        description: News & RSS feed

# Row 2 — *arr stack full-width

- "*arr Stack":
    - Seerr:
        icon: overseerr
        href: https://seerr.example.com
        container: seerr
        description: Media requests
        widget:
          type: overseerr
          url: http://seerr:5055
          key: '{{HOMEPAGE_VAR_OVERSEERR_KEY}}'
          fields: ["processing", "available"]
    - Sonarr:
        icon: sonarr.png
        href: https://sonarr.example.com
        container: sonarr
        description: TV series management
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: '{{HOMEPAGE_VAR_SONARR_KEY}}'
    - Radarr:
        icon: radarr.png
        href: https://radarr.example.com
        container: radarr
        description: Movie management
        widget:
          type: radarr
          url: http://radarr:7878
          key: '{{HOMEPAGE_VAR_RADARR_KEY}}'
          fields: ["wanted", "missing", "queued"]
    - Lidarr:
        icon: lidarr.png
        href: https://lidarr.example.com
        container: lidarr
        description: Music management
        widget:
          type: lidarr
          url: http://lidarr:8686
          key: '{{HOMEPAGE_VAR_LIDARR_KEY}}'
    - Bazarr:
        icon: bazarr.png
        href: https://bazarr.example.com
        container: bazarr
        description: Subtitle management
        widget:
          type: bazarr
          url: http://bazarr:6767
          key: '{{HOMEPAGE_VAR_BAZARR_KEY}}'
          fields: ["missingEpisodes"]
    - Prowlarr:
        icon: prowlarr.png
        href: https://prowlarr.example.com
        container: prowlarr
        description: Indexer management
        widget:
          type: prowlarr
          url: http://prowlarr:9696
          key: '{{HOMEPAGE_VAR_PROWLARR_KEY}}'
          fields: ["numberOfGrabs", "numberOfQueries"]
    - Tdarr:
        icon: tdarr.png
        href: https://tdarr.example.com
        container: tdarr
        description: Transcoding
        widget:
          type: tdarr
          url: http://tdarr:8265
          fields: ["queue", "errored"]
    - FlareSolverr:
        icon: flaresolverr.png
        container: flaresolverr
        description: Cloudflare bypass
