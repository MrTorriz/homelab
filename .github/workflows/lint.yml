name: lint

on:
  push:
    branches: [main]
  pull_request:

# Every action is pinned to a full commit SHA; the comment carries the tag it
# resolved to on 2026-08-28. Dependabot keeps the pins moving.
permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run shellcheck (scripts/ and security/)
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # 2.0.0
        with:
          severity: warning
      - name: Compile published Python files
        run: git ls-files '*.py' -z | xargs -0 -r python -m py_compile

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.x'
      - run: pip install yamllint==1.35.1
      - run: yamllint -c .yamllint .

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          config: .markdownlint.yaml
          globs: '**/*.md'

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Validate compose with a stub .env
        working-directory: docker
        run: |
          cp .env.example .env
          docker compose config -q
      - name: Validate the synthetic monitoring demo
        run: docker compose -f monitoring/demo/docker-compose.demo.yml config -q
      - name: No privileged containers
        run: '! grep -n "privileged" docker/compose.yml'

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Relative links and image orphans
        run: bash scripts/check-links.sh
      - name: Fact consistency (container count, snapshot date, stale strings)
        run: bash scripts/check-facts.sh
